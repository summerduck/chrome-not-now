<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Focus Blocker — Settings</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #1a1a1a;
        color: #eee;
        margin: 0;
        padding: 2rem 1rem;
        min-height: 100vh;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.8rem;
        margin: 0 0 2rem;
      }
      section {
        margin-bottom: 2rem;
      }
      h2 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #666;
        margin: 0 0 0.75rem;
      }
      .domain-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-bottom: 1px solid #2a2a2a;
      }
      .domain-row span {
        font-size: 0.95rem;
      }
      .remove-btn {
        background: none;
        border: 1px solid #3a3a3a;
        color: #666;
        border-radius: 4px;
        padding: 0.2rem 0.55rem;
        cursor: pointer;
        font-size: 0.8rem;
        transition: border-color 0.15s, color 0.15s;
      }
      .remove-btn:hover {
        border-color: #c44;
        color: #c44;
      }
      .add-row {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      input[type="text"],
      input[type="number"] {
        background: #222;
        border: 1px solid #3a3a3a;
        color: #eee;
        border-radius: 4px;
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
        outline: none;
      }
      input[type="text"]:focus,
      input[type="number"]:focus {
        border-color: #666;
      }
      input[type="text"] {
        flex: 1;
      }
      input[type="number"] {
        width: 4.2rem;
        text-align: center;
      }
      input::placeholder {
        color: #555;
      }
      #add-btn {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        color: #ccc;
        border-radius: 4px;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.9rem;
      }
      #add-btn:hover {
        background: #333;
      }
      .days {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .day-label input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .day-label span {
        display: block;
        padding: 0.35rem 0.7rem;
        border-radius: 4px;
        border: 1px solid #3a3a3a;
        color: #666;
        cursor: pointer;
        font-size: 0.85rem;
        user-select: none;
        transition: background 0.1s, color 0.1s, border-color 0.1s;
      }
      .day-label input:checked + span {
        background: #eee;
        color: #1a1a1a;
        border-color: #eee;
      }
      .hours {
        display: flex;
        align-items: center;
        gap: 1.2rem;
      }
      .hours label {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.9rem;
        color: #ccc;
      }
      .hours label .unit {
        color: #555;
        font-size: 0.85rem;
      }
      #save-btn {
        background: #eee;
        color: #1a1a1a;
        border: none;
        border-radius: 4px;
        padding: 0.6rem 1.6rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: background 0.15s;
      }
      #save-btn:hover {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Settings</h1>

      <section>
        <h2>Blocked sites</h2>
        <div id="domain-list"></div>
        <div class="add-row">
          <input id="new-domain" type="text" placeholder="example.com" />
          <button id="add-btn">Add</button>
        </div>
      </section>

      <section>
        <h2>Schedule</h2>
        <div class="days">
          <label class="day-label"><input type="checkbox" id="day-0" /><span>Sun</span></label>
          <label class="day-label"><input type="checkbox" id="day-1" /><span>Mon</span></label>
          <label class="day-label"><input type="checkbox" id="day-2" /><span>Tue</span></label>
          <label class="day-label"><input type="checkbox" id="day-3" /><span>Wed</span></label>
          <label class="day-label"><input type="checkbox" id="day-4" /><span>Thu</span></label>
          <label class="day-label"><input type="checkbox" id="day-5" /><span>Fri</span></label>
          <label class="day-label"><input type="checkbox" id="day-6" /><span>Sat</span></label>
        </div>
        <div class="hours">
          <label>From <input id="start-hour" type="number" min="0" max="23" /> <span class="unit">:00</span></label>
          <label>To <input id="end-hour" type="number" min="0" max="23" /> <span class="unit">:00</span></label>
        </div>
      </section>

      <button id="save-btn">Save</button>
    </div>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
